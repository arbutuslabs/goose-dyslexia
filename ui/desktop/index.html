<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:* https: ws: wss:; object-src 'none'; font-src 'self' data: https:; media-src 'self' mediastream:; form-action 'none'; base-uri 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'self' https: http:;"
    />
    <title>Lira</title>
    <script>
      // Initialize theme before any content loads.
      //
      // The main process resolves the theme from the settings file (the source of
      // truth, and what ThemeContext reads) and injects it via preload, so this
      // matches the final theme with no round trip. The OS preference is only a
      // fallback for when the injected value is unavailable — relying on it
      // outright shows the wrong theme to anyone whose app theme differs from
      // their system theme.
      (function () {
        function isDarkTheme() {
          try {
            var injected = window.appConfig && window.appConfig.get('GOOSE_RESOLVED_THEME');
            if (injected === 'dark' || injected === 'light') {
              return injected === 'dark';
            }
          } catch (error) {
            console.warn('Failed to read injected theme, using system preference:', error);
          }
          return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        var dark = isDarkTheme();
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link href="./src/styles/main.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/renderer.tsx"></script>
  </body>
</html>
